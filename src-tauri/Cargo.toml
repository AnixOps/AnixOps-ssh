[package]
name = "anixops-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cross-platform session manager for the system OpenSSH"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
dirs.workspace = true
easyssh-core = { path = "../crates/easyssh-core" }
easyssh-crypto = { path = "../crates/easyssh-crypto" }
easyssh-store = { path = "../crates/easyssh-store" }
easyssh-telemetry = { path = "../crates/easyssh-telemetry" }
easyssh-vault = { path = "../crates/easyssh-vault", features = ["os-keyring"] }
easysshd = { path = "../crates/easysshd" }
portable-pty = "0.9"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
uuid.workspace = true
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
