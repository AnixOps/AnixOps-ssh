[package]
name = "anixops-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cross-platform session manager for the system OpenSSH"

# Tauri mobile loads the app as a library (`cdylib` on Android, `staticlib` on
# iOS); the desktop binary in main.rs calls the same `run`.
[lib]
name = "anixops_ssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# What every platform needs: the store, the in-process engine and the shell.
[dependencies]
easyssh-core = { path = "../crates/easyssh-core" }
easyssh-engine = { path = "../crates/easyssh-engine" }
easyssh-ssh = { path = "../crates/easyssh-ssh" }
easyssh-store = { path = "../crates/easyssh-store" }
fontdb = "0.23"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tokio.workspace = true

# Desktop only: the daemon, local shells and serial ports, the OS keychain,
# Windows Hello and Touch ID, OpenSSH, native dialogs. Android and iOS get none
# of them (docs/mobile-prototype.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
chrono.workspace = true
dirs.workspace = true
easyssh-ai = { path = "../crates/easyssh-ai" }
easyssh-services = { path = "../crates/easyssh-services" }
easyssh-crypto = { path = "../crates/easyssh-crypto" }
easyssh-sessionlog = { path = "../crates/easyssh-sessionlog" }
easyssh-telemetry = { path = "../crates/easyssh-telemetry" }
easyssh-unlock = { path = "../crates/easyssh-unlock" }
easyssh-update = { path = "../crates/easyssh-update" }
easyssh-vault = { path = "../crates/easyssh-vault", features = ["os-keyring"] }
easysshd = { path = "../crates/easysshd" }
portable-pty = "0.9"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# `deep-link`: a second launch with an anixops-ssh:// link hands it to the
# running app instead of opening another one.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
uuid.workspace = true
zeroize = "1"

# Android: the TLS verifier asks the system trust store through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
rustls-platform-verifier = "0.7"

# Android and iOS only: the device key in the Keystore or Keychain, biometric
# unlock, and the plugin whose Kotlin and Swift classes keep them
# (src-tauri/plugins/device-key). The plugin is outside the workspace; see its
# Cargo.toml.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
easyssh-mobile-keys = { path = "../crates/easyssh-mobile-keys" }
easyssh-vault = { path = "../crates/easyssh-vault" }
tauri-plugin-device-key = { path = "plugins/device-key" }
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
