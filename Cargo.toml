[workspace]
resolver = "2"
members = ["crates/easyssh-core", "crates/easyssh-crypto", "crates/easyssh-e2e", "crates/easyssh-engine", "crates/easyssh-mobile-keys", "crates/easyssh-import", "crates/easyssh-proto", "crates/easyssh-sessionlog", "crates/easyssh-ai", "crates/easyssh-ssh", "crates/easyssh-store", "crates/easyssh-vault", "crates/easysshd", "crates/easyssh-server", "crates/easyssh-sync", "crates/easyssh-telemetry", "crates/easyssh-unlock", "src-tauri"]
exclude = ["src-tauri/plugins/device-key"]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AnixOps/EasySSH"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "5"
fs4 = { version = "0.12", features = ["sync"] }
hmac = "0.12"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = "0.59"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
