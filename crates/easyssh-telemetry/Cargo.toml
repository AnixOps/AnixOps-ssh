[package]
name = "easyssh-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in crash reports (Sentry envelope to a self-hosted GlitchTip) and anonymous usage statistics, with a scrubber that removes host names, addresses, users and paths"
