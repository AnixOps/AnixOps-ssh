[package]
name = "easyssh-unlock"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows Hello, Touch ID and FIDO2 security keys as vault unlock methods (thin platform backends over easyssh-vault)"

[dependencies]
easyssh-crypto = { path = "../easyssh-crypto", features = ["os-keyring"] }
easyssh-vault = { path = "../easyssh-vault" }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["block2"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
ctap-hid-fido2 = "3.6.1"
