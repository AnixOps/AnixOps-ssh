[package]
name = "easyssh-unlock"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows Hello and Touch ID as vault unlock methods (thin platform gates over easyssh-vault)"

[dependencies]
easyssh-crypto = { path = "../easyssh-crypto", features = ["os-keyring"] }
easyssh-vault = { path = "../easyssh-vault" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["block2"] }
