[package]
name = "easyssh-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The in-process SSH engine: host keys in the store, prompts, and terminal sessions on russh. No daemon, no OpenSSH, no PTY, so it builds for Android and iOS"

[dependencies]
async-trait = "0.1"
base64.workspace = true
easyssh-core = { path = "../easyssh-core" }
easyssh-ssh = { path = "../easyssh-ssh" }
easyssh-store = { path = "../easyssh-store" }
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa", "flate2"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile.workspace = true
