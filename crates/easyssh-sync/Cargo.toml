[package]
name = "easyssh-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EasySSH sync client: signed envelopes, field-level merge with history, push/pull engine and OPAQUE sign-in"

[dependencies]
base64.workspace = true
easyssh-crypto = { path = "../easyssh-crypto" }
ed25519-dalek = "3"
opaque-ke = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
