[package]
name = "easyssh-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SQLite storage for EasySSH v2: entities, numbered migrations, sync metadata and the v1 JSON migration"

[dependencies]
base64.workspace = true
chrono.workspace = true
easyssh-core = { path = "../easyssh-core" }
easyssh-crypto = { path = "../easyssh-crypto" }
easyssh-import = { path = "../easyssh-import" }
easyssh-sync = { path = "../easyssh-sync" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v5"] }
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
