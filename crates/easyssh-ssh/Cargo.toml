[package]
name = "easyssh-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SSH engine on russh: auth chain, channels, SFTP, forwards, jump chains, known hosts"

[dependencies]
async-trait = "0.1"
base64.workspace = true
hmac.workspace = true
rand.workspace = true
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
sha1 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing = "0.1"

[dev-dependencies]
tempfile.workspace = true
