[package]
name = "easysshd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EasySSH desktop daemon: authenticated local IPC, terminal sessions that outlive the UI"

[dependencies]
async-trait = "0.1"
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
easyssh-core = { path = "../easyssh-core" }
easyssh-proto = { path = "../easyssh-proto" }
easyssh-sessionlog = { path = "../easyssh-sessionlog" }
easyssh-crypto = { path = "../easyssh-crypto" }
easyssh-ssh = { path = "../easyssh-ssh" }
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa", "flate2"] }
easyssh-store = { path = "../easyssh-store" }
easyssh-sync = { path = "../easyssh-sync" }
easyssh-telemetry = { path = "../easyssh-telemetry" }
easyssh-unlock = { path = "../easyssh-unlock" }
easyssh-vault = { path = "../easyssh-vault", features = ["os-keyring"] }
ed25519-dalek = "3"
fs4.workspace = true
hmac.workspace = true
portable-pty = "0.9"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
uuid.workspace = true
zeroize = "1"
serialport = { version = "4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
easyssh-server = { path = "../easyssh-server" }
uuid.workspace = true
zeroize = "1"
tempfile.workspace = true
