# Synthetic inventory (example.com, 192.0.2.x).
standalone ansible_host=192.0.2.9

[web]
web[01:03].example.com
web-odd ansible_host=192.0.2.50 ansible_user=alice ansible_ssh_private_key_file=~/.ssh/web_ed25519 ansible_password=not-a-real-secret
big[1:3000].example.com   # beyond the cap

[db]
db1 ansible_host=192.0.2.20 ansible_ssh_extra_args='-o ProxyJump=hop1,hop2' ansible_port=2022
[db:vars]
ansible_user=dbadmin

[monitoring]
db1
mon1 ansible_host="{{ mon_ip }}"
abc-[a:c] ansible_port=2201

[prod:children]
web
db

[prod:vars]
ansible_user=deploy
ansible_ssh_common_args=-o StrictHostKeyChecking=no -J jump@bastion.example.com:2222

[all:vars]
ansible_user=ops
ansible_port=2200

[local]
localbox ansible_connection=local
