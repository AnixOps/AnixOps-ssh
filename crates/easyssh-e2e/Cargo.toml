[package]
name = "easyssh-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "End-to-end tests that run the OpenSSH orchestration against real servers in Docker"

[dependencies]
async-trait = "0.1"
easyssh-core = { path = "../easyssh-core" }
easyssh-ssh = { path = "../easyssh-ssh", features = ["software-key"] }
tokio = { workspace = true, features = ["fs"] }
tempfile = "3"

[dev-dependencies]
base64.workspace = true
portable-pty = "0.9"
easysshd = { path = "../easysshd" }
easyssh-crypto = { path = "../easyssh-crypto" }
easyssh-sessionlog = { path = "../easyssh-sessionlog" }
easyssh-store = { path = "../easyssh-store" }
easyssh-vault = { path = "../easyssh-vault" }
serde_json.workspace = true
tokio.workspace = true
