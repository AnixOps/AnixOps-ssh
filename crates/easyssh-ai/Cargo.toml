[package]
name = "easyssh-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ask AI with the user's own key: request building for Anthropic, OpenAI-compatible and Ollama, streaming, secret scrubbing of terminal context"

[dependencies]
base64.workspace = true
easyssh-store = { path = "../easyssh-store" }
easyssh-vault = { path = "../easyssh-vault" }
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { version = "2", default-features = false, features = ["tls"] }
zeroize = "1"

[dev-dependencies]
easyssh-crypto = { path = "../easyssh-crypto" }
