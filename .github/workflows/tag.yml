name: Tag release

# Merging a version bump into main tags it and publishes the release; nobody
# tags by hand. The smoke test in RELEASING.md runs on the installers from the
# version-bump pull request's CI before it is merged.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - src-tauri/tauri.conf.json
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the new version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read and check the version
        id: version
        run: |
          version=$(jq -r .version package.json)
          for file in src-tauri/tauri.conf.json; do
            actual=$(jq -r .version "$file")
            [ "$actual" = "$version" ] || { echo "::error file=$file::version $actual does not match package.json $version"; exit 1; }
          done
          grep -q "^version = \"$version\"" Cargo.toml || { echo "::error file=Cargo.toml::workspace version does not match package.json $version"; exit 1; }
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version $version is not X.Y.Z"; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create the tag if it is new
        id: create
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "AnixOps SSH ${TAG#v}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # A tag pushed with the workflow token does not start other workflows, so
  # the release is called directly.
  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
