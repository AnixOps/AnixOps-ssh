name: Release

# Normally started by tag.yml when a version bump lands on main. Pushing a
# tag such as v2.0.1 by hand still works.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, such as v2.0.0
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Check version and create draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Tag must match the app version
        run: |
          version="${TAG#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            actual=$(jq -r .version "$file")
            [ "$actual" = "$version" ] || { echo "::error file=$file::version $actual does not match tag $TAG"; exit 1; }
          done
          grep -q "^version = \"$version\"" Cargo.toml || { echo "::error file=Cargo.toml::workspace version does not match tag $TAG"; exit 1; }
      - name: Lockfiles match the manifests
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          npm ci --ignore-scripts --dry-run > /dev/null
      - name: Create draft release
        env:
          MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          notes="Windows 安装包未签名，首次运行时在 SmartScreen 中选择“更多信息 → 仍要运行”。"
          if [ "$MAC_SIGNED" != "true" ]; then
            notes="$notes macOS 版本未签名，首次打开请右键选择“打开”。"
          fi
          # Hand-written notes for this version, when there are any, come first.
          if [ -f "docs/releases/$TAG.md" ]; then
            notes="$(cat "docs/releases/$TAG.md")"$'\n\n'"$notes"
          fi
          gh release create "$TAG" --draft --verify-tag --title "AnixOps SSH ${TAG#v}" --generate-notes --notes "$notes"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libudev-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # macOS builds are signed and notarized when the Apple secrets exist
      # (docs/signing.md); without them the build is left unsigned.
      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          # Telemetry endpoints (docs/telemetry.md); empty means the build collects nothing.
          EASYSSH_SENTRY_DSN: ${{ secrets.EASYSSH_SENTRY_DSN }}
          EASYSSH_USAGE_URL: ${{ secrets.EASYSSH_USAGE_URL }}
          # Trusted update feed keys (public, comma separated); empty means the build does not check for updates.
          EASYSSH_UPDATE_PUBLIC_KEYS: ${{ vars.EASYSSH_UPDATE_PUBLIC_KEYS }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_CERTIFICATE" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo "Signing and notarizing the macOS build"
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8
          fi
          unset APPLE_API_KEY_P8
          npx tauri build
      - name: Upload installers to the draft release
        run: |
          mkdir upload
          for file in target/release/bundle/{nsis/*.exe,dmg/*.dmg,deb/*.deb,appimage/*.AppImage}; do
            [ -f "$file" ] && cp "$file" "upload/$(basename "$file" | tr ' ' '-')"
          done
          ls -la upload
          gh release upload "$TAG" upload/* --clobber

  # Mobile jobs (RELEASING.md, "Mobile"). They run next to the desktop build,
  # are not in publish's needs, and are continue-on-error: whatever happens
  # here never blocks or fails the desktop release. A missing secret skips the
  # signed output with a note in the job summary. Assets uploaded after the
  # release was published are still attached (gh release upload works on both).
  android:
    name: Android (signed AAB and APK)
    needs: prepare
    runs-on: ubuntu-22.04
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Is signing configured
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets found: building a signed release."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Android: built unsigned"
              echo
              echo "One or more of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD is not set. The APK is built to prove the release build works and is kept as a workflow artifact only; nothing is attached to the release (an unsigned APK cannot be installed and Play rejects an unsigned AAB). See RELEASING.md, Mobile."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Android SDK and NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - name: Decode the upload keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          # Read by app/build.gradle.kts, with the three passwords and alias below.
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          EASYSSH_SENTRY_DSN: ${{ secrets.EASYSSH_SENTRY_DSN }}
          EASYSSH_USAGE_URL: ${{ secrets.EASYSSH_USAGE_URL }}
        run: |
          # Only arm64 is built: it is the one Android target CI proves. The
          # AAB therefore serves 64-bit ARM devices (nearly every phone sold
          # since 2017) and not x86 emulators or Chromebooks.
          npx tauri android build --apk --aab --target aarch64
      - name: Collect and check the output
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          version="${TAG#v}"
          mkdir upload
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          [ -n "$apk" ] || { echo "::error::no release APK was built"; exit 1; }
          # Tauri derives versionCode from the app version: major*1000000 + minor*1000 + patch.
          IFS=. read -r major minor patch <<< "$version"
          want=$(( major * 1000000 + minor * 1000 + patch ))
          got=$(sed -n 's/^tauri.android.versionCode=//p' src-tauri/gen/android/app/tauri.properties)
          echo "versionCode: expected $want, Tauri wrote ${got:-nothing}"
          [ "$got" = "$want" ] || { echo "::error::Android versionCode ${got:-unset} does not follow the app version (expected $want)"; exit 1; }
          if [ "$SIGNED" = "true" ]; then
            [ -n "$aab" ] || { echo "::error::no AAB was built"; exit 1; }
            cp "$apk" "upload/AnixOps-SSH-$version-android-arm64.apk"
            cp "$aab" "upload/AnixOps-SSH-$version-android.aab"
            "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose "upload/AnixOps-SSH-$version-android-arm64.apk" | head -5
          else
            cp "$apk" "upload/AnixOps-SSH-$version-android-arm64-unsigned.apk"
          fi
          ls -la upload
      - name: Attach to the release
        if: steps.signing.outputs.signed == 'true'
        run: |
          gh release upload "$TAG" upload/* --clobber
          {
            echo "### Android: signed release attached"
            echo
            echo "- versionName ${TAG#v}, versionCode derived from it"
            echo "- AAB for Google Play (upload it in the Play Console; the first one by hand, see RELEASING.md)"
            echo "- arm64 APK for direct download"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the unsigned APK as an artifact
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AnixOps-SSH-Android-unsigned
          path: upload/*.apk
      - name: Failure note
        if: failure()
        run: |
          echo "### Android job failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The desktop release is not affected. Re-run this job after fixing the cause; see the log above." >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS (TestFlight)
    needs: prepare
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Is signing configured
        id: signing
        env:
          HAVE_ALL: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_KEY_BASE64 != '' && secrets.APPLE_TEAM_ID != '' && secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          if [ "$HAVE_ALL" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### iOS: skipped"
              echo
              echo "One or more of APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_BASE64, APPLE_TEAM_ID, IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD and IOS_PROVISIONING_PROFILE_BASE64 is not set, so no IPA was built or uploaded. See RELEASING.md, Mobile."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v5
        if: steps.signing.outputs.signed == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.signing.outputs.signed == 'true'
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        if: steps.signing.outputs.signed == 'true'
      - name: Set the bundle version from the tag
        if: steps.signing.outputs.signed == 'true'
        run: |
          version="${TAG#v}"
          # CFBundleShortVersionString is the app version. CFBundleVersion is
          # the same number Android uses as versionCode (major*1000000 +
          # minor*1000 + patch): one integer that rises with every version, as
          # App Store Connect requires for builds of an app.
          IFS=. read -r major minor patch <<< "$version"
          build=$(( major * 1000000 + minor * 1000 + patch ))
          cd src-tauri/gen/apple
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" anixops-ssh_iOS/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" anixops-ssh_iOS/Info.plist
          sed -i '' -E "s/^( *CFBundleShortVersionString: ).*/\1$version/; s/^( *CFBundleVersion: ).*/\1\"$build\"/" project.yml
          grep -n "CFBundle.*Version" project.yml
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" anixops-ssh_iOS/Info.plist
      - run: npm ci
        if: steps.signing.outputs.signed == 'true'
      - name: Install the App Store Connect key
        if: steps.signing.outputs.signed == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
      - name: Build the IPA
        if: steps.signing.outputs.signed == 'true'
        env:
          # tauri-cli imports the certificate into a temporary keychain and
          # installs the provisioning profile from these.
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EASYSSH_SENTRY_DSN: ${{ secrets.EASYSSH_SENTRY_DSN }}
          EASYSSH_USAGE_URL: ${{ secrets.EASYSSH_USAGE_URL }}
        run: |
          export APPLE_API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8"
          npx tauri ios build --export-method app-store-connect --ci
      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$ipa" ] || { echo "::error::no IPA was built"; exit 1; }
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          {
            echo "### iOS: uploaded to TestFlight"
            echo
            echo "- ${TAG#v}, build number derived from it. Processing takes a few minutes; the build then appears in App Store Connect, TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Failure note
        if: failure()
        run: |
          echo "### iOS job failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The desktop release is not affected. Re-run this job after fixing the cause; see the log above." >> "$GITHUB_STEP_SUMMARY"

  # The signed update feeds (RELEASING.md, "Update feed"): one
  # anixops-ssh-<os>.appcast.json per desktop platform, in the anix-kit
  # anixops-appcast-v1 format, attached to the release before it is published.
  # Without the signing secret the job is skipped with a warning, and a
  # failure here never blocks the release (publish does not need it to pass).
  update-feed:
    name: Update feeds
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Is signing configured
        id: signing
        env:
          KEY: ${{ secrets.ANIXOPS_UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANIXOPS_UPDATE_SIGNING_KEY is not set: no update feeds were built or attached (RELEASING.md, Update feed)."
            echo "### Update feeds: skipped (secret ANIXOPS_UPDATE_SIGNING_KEY is not set)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@v5
        if: steps.signing.outputs.signed == 'true'
        with:
          # anix-kit needs Go 1.26; the toolchain it names is fetched if newer.
          go-version: "1.26"
          cache: false
      - name: Build, sign and attach the feeds
        if: steps.signing.outputs.signed == 'true'
        env:
          ANIXOPS_UPDATE_SIGNING_KEY: ${{ secrets.ANIXOPS_UPDATE_SIGNING_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/update-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ANIXOPS_UPDATE_SIGNING_KEY" > "$key"
          mkdir assets
          gh release download "$TAG" --dir assets --pattern '*-setup.exe' --pattern '*.dmg' --pattern '*.AppImage'
          ls -la assets
          # Sequence: unix time of this run, so a re-run is newer than the run before.
          KEY_FILE="$key" SEQUENCE="$(date +%s)" scripts/build-update-feeds.sh "$TAG" assets feeds
          ls -la feeds
          gh release upload "$TAG" feeds/*.appcast.json --clobber
          {
            echo "### Update feeds attached"
            echo
            for feed in feeds/*.appcast.json; do echo "- $(basename "$feed")"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # The full benchmark run (docs/benchmarks.md) for the tagged commit, attached
  # to the release when it finishes. Like the mobile jobs it is not in
  # publish's needs: it takes a while, and a failure here never blocks or
  # fails the release itself.
  bench:
    name: Benchmarks
    needs: prepare
    uses: ./.github/workflows/bench.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  bench-attach:
    name: Attach benchmark report
    needs: bench
    if: ${{ !cancelled() && needs.bench.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bench-results
          path: bench
      - name: Attach to the release and add a summary to its notes
        run: |
          gh release upload "$TAG" bench/bench-report.md bench/bench.json --repo "$GITHUB_REPOSITORY" --clobber
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          if ! grep -q '^### Benchmarks' <<< "$body"; then
            printf '%s\n\n%s\n' "$body" "$(cat bench/release-summary.md)" > notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
          cat bench/bench-report.md >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [build, update-feed]
    # A failed or skipped feed job does not hold the release back.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
