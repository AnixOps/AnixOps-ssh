name: CI

# Pull requests run once, as `pull_request` (a branch push no longer starts a
# second, identical run). main runs everything after each merge. A manual run
# (Actions, "Run workflow" on a branch) also runs everything, installers
# included.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on main are never
# cancelled half-way, so main always ends with a full result and saves the
# Rust caches the pull requests start from; a newer push only replaces a run
# that is still waiting.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Line tables keep file:line in panics and backtraces but skip the full
  # debug info: smaller objects, faster links and smaller caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # What the change needs: scripts/ci-changes.sh. Frontend- and docs-only pull
  # requests skip the end-to-end and Android jobs (not required checks; the
  # Rust jobs always run). Installers are built on main, manual runs, and pull
  # requests that change the version or packaging.
  changes:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.decide.outputs.native }}
      terminal: ${{ steps.decide.outputs.terminal }}
      installers: ${{ steps.decide.outputs.installers }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  frontend:
    name: Frontend and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install fonts for CJK screenshots
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install
        run: mkdir -p logs && npm ci 2>&1 | tee logs/npm-install.log
        shell: bash -o pipefail {0}
      - name: Typecheck and build
        run: npm run build 2>&1 | tee logs/frontend-build.log
        shell: bash -o pipefail {0}
      - name: Unit tests
        run: npm test 2>&1 | tee logs/frontend-test.log
        shell: bash -o pipefail {0}
      - name: Completion specs
        run: npm run check:specs 2>&1 | tee logs/check-specs.log
        shell: bash -o pipefail {0}
      - name: Shell integration scripts
        run: |
          sudo apt-get install -y zsh fish
          CHECK_SHELLS_REQUIRED=1 scripts/check-shell-integration.sh 2>&1 | tee logs/check-shell-integration.log
        shell: bash -o pipefail {0}
      - name: Screenshots
        shell: bash -o pipefail {0}
        run: |
          npx playwright install --with-deps chromium > logs/playwright-install.log 2>&1
          npm run preview > logs/preview.log 2>&1 &
          npx --yes wait-on@8 http://localhost:4173 --timeout 30000
          npm run screenshots -- http://localhost:4173 screenshots 2>&1 | tee logs/screenshots.log
          npm run test:mobile -- http://localhost:4173 2>&1 | tee logs/mobile-e2e.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: |
            logs/
            screenshots/
            dist/
            package-lock.json
          if-no-files-found: ignore

  # Required checks: runs on every pull request, whatever it changes.
  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -o pipefail {0}
    env:
      INSTALLERS: ${{ needs.changes.outputs.installers }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libudev-dev
          # The shell integration tests run the delivery against local shells.
          sudo apt-get install -y zsh fish
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The macOS job also builds the iOS app library (below).
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-ios,aarch64-apple-ios-sim' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests start from main's cache and do not save their own:
          # many branch caches would push main's out of the 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Release builds install exactly what the lockfiles say; so does CI, so
      # a green CI run means the release install works (npm ci fails on a
      # package.json / package-lock.json mismatch, cargo --locked on a stale
      # Cargo.lock). scripts/check-workflows.mjs keeps it that way.
      - name: Cargo.lock matches Cargo.toml
        run: mkdir -p logs && cargo metadata --locked --format-version 1 > /dev/null 2> logs/cargo-locked.log || { cat logs/cargo-locked.log; exit 1; }
        shell: bash
      - name: Install frontend
        run: mkdir -p logs && npm ci > logs/npm-install.log 2>&1
      - name: Build frontend
        id: frontend
        run: npm run build 2>&1 | tee logs/frontend-build.log
      # The checks below all run once the frontend is built, so one CI round
      # reports every failure instead of stopping at the first.
      - name: rustfmt
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        # On failure, also save the exact fix as logs/fmt.patch.
        run: |
          cargo fmt --all --check 2>&1 | tee logs/fmt.log || {
            cargo fmt --all && git diff > logs/fmt.patch
            exit 1
          }
      - name: clippy
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee logs/clippy.log
      - name: test
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: cargo test --workspace 2>&1 | tee logs/test.log
      # iOS runs inside the macOS job instead of a job of its own, so a CI run
      # needs one macOS runner, not two (macOS runners are what CI waits for).
      # No signing; docs/mobile-prototype.md.
      - name: Engine crates build for iOS
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.frontend.outcome == 'success' }}
        run: |
          cargo check --target aarch64-apple-ios \
            -p easyssh-core -p easyssh-crypto -p easyssh-ssh -p easyssh-store -p easyssh-vault -p easyssh-engine -p easyssh-mobile-keys \
            2>&1 | tee logs/ios-engine-check.log
      - name: App library for the iOS simulator
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.frontend.outcome == 'success' }}
        run: |
          start=$(date +%s)
          cargo build --release --target aarch64-apple-ios-sim -p anixops-ssh --lib 2>&1 | tee logs/ios-lib-build.log
          {
            echo "# iOS simulator library"
            echo
            echo "- libanixops_ssh_lib.a: $(stat -f %z target/aarch64-apple-ios-sim/release/libanixops_ssh_lib.a) bytes"
            echo "- build seconds: $(( $(date +%s) - start ))"
          } | tee logs/ios-metrics.md
      - name: Xcode project and simulator app (informational)
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.frontend.outcome == 'success' && env.INSTALLERS == 'true' }}
        continue-on-error: true
        run: |
          brew install xcodegen > /dev/null 2>&1 || true
          # The Xcode project is checked in; generate it only when it is missing.
          [ -d src-tauri/gen/apple ] || npx tauri ios init --ci 2>&1 | tee logs/ios-init.log
          npx tauri ios build --debug --target aarch64-sim --ci 2>&1 | tee logs/ios-build.log
      # Installers: main, manual runs, and pull requests that change the
      # version or packaging (scripts/ci-changes.sh). A pull request without
      # them is still compiled, linted and tested on every platform above.
      - name: Bundle
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' && env.INSTALLERS == 'true' }}
        env:
          # Public keys only (RELEASING.md, "Update feed"); empty means no update check.
          EASYSSH_UPDATE_PUBLIC_KEYS: ${{ vars.EASYSSH_UPDATE_PUBLIC_KEYS }}
        run: npx tauri build 2>&1 | tee logs/bundle.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ runner.os }}
          path: |
            logs/
            Cargo.lock
          if-no-files-found: ignore
      - if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: logs-iOS
          path: |
            src-tauri/gen/apple/
            !src-tauri/gen/apple/build/
            !src-tauri/gen/apple/Externals/
            !src-tauri/gen/apple/assets/
          if-no-files-found: ignore
      - if: env.INSTALLERS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AnixOps-SSH-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  e2e:
    name: End-to-end (Linux)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system library for the FIDO2 key backend (hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate test key
        run: mkdir -p logs && e2e/prepare.sh
      - name: Start OpenSSH containers
        run: docker compose -f e2e/docker-compose.yml up -d --build 2>&1 | tee logs/e2e-compose.log
      - name: Wait for both servers
        run: e2e/wait-ready.sh 90 2>&1 | tee logs/e2e-wait.log
      - name: Build tests
        run: cargo test -p easyssh-e2e --no-run 2>&1 | tee logs/e2e-build.log
      - name: Run end-to-end tests
        run: cargo test -p easyssh-e2e --no-fail-fast -- --ignored --test-threads=1 2>&1 | tee logs/e2e.log
      # Build only, nothing is pushed. Catches a broken Dockerfile or a
      # Cargo.lock that `--locked` refuses, which the Rust jobs would not see.
      - name: Build easyssh-server image
        if: ${{ !cancelled() }}
        run: |
          docker build -f crates/easyssh-server/Dockerfile -t easyssh-server:ci . 2>&1 | tee logs/server-image.log
          docker run --rm easyssh-server:ci --version 2>&1 | tee -a logs/server-image.log
      - name: Container logs
        if: always()
        run: |
          mkdir -p logs
          docker compose -f e2e/docker-compose.yml logs --no-color > logs/e2e-containers.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-e2e
          path: logs/
          if-no-files-found: ignore

  # The app's real frontend in Chromium, driven like a person would use a
  # terminal (copy, paste, select, scroll, find, links, IME, vim, tmux, htop,
  # zoom, tabs, reconnect), against a real OpenSSH server through the real
  # session daemon and built-in engine: scripts/terminal-e2e.mjs and
  # crates/easyssh-e2e/examples/web_bridge.rs. Runs for frontend changes too,
  # since most of what it checks lives there.
  terminal-e2e:
    name: Terminal end-to-end (Linux)
    needs: changes
    if: needs.changes.outputs.terminal == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Linux system library for the FIDO2 key backend (hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev fonts-noto-cjk fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate test key
        run: mkdir -p logs && e2e/prepare.sh
      - name: Start OpenSSH containers
        run: docker compose -f e2e/docker-compose.yml up -d --build 2>&1 | tee logs/e2e-compose.log
      - name: Build the session bridge
        run: cargo build -p easyssh-e2e --example web_bridge 2>&1 | tee logs/web-bridge-build.log
      - name: Build the frontend
        run: |
          npm ci > logs/npm-install.log 2>&1
          npm run build 2>&1 | tee logs/frontend-build.log
          npx playwright install --with-deps chromium > logs/playwright-install.log 2>&1
      - name: Wait for both servers
        run: e2e/wait-ready.sh 90 2>&1 | tee logs/e2e-wait.log
      - name: Run the terminal checks
        run: |
          npm run preview > logs/preview.log 2>&1 &
          npx --yes wait-on@8 http://localhost:4173 --timeout 30000
          node scripts/terminal-e2e.mjs http://localhost:4173 terminal-e2e 2>&1 | tee logs/terminal-e2e.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-terminal-e2e
          path: |
            logs/
            terminal-e2e/
          if-no-files-found: ignore

  # Mobile prototype (docs/mobile-prototype.md): the engine crates build for
  # Android, and the Tauri app builds a debug APK with the runner's SDK and NDK.
  # Nothing is signed or published; the APK is an artifact for trying on a phone.
  android:
    name: Android (debug APK)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Android SDK and NDK
        run: |
          mkdir -p logs
          # The runner image ships the SDK and an NDK; accept the licences so
          # Gradle may fetch the platform and build tools it asks for.
          echo "ANDROID_HOME=$ANDROID_HOME" "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" | tee logs/android-env.log
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>&1 | tee -a logs/android-env.log
          java -version 2>&1 | tee -a logs/android-env.log
      - name: Engine crates build for Android
        run: |
          # What `tauri android build` sets up for cargo, for a plain `cargo check`.
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          cargo check --target aarch64-linux-android \
            -p easyssh-core -p easyssh-crypto -p easyssh-ssh -p easyssh-store -p easyssh-vault -p easyssh-engine -p easyssh-mobile-keys \
            2>&1 | tee logs/android-engine-check.log
      - name: Install frontend
        run: npm ci > logs/npm-install.log 2>&1
      - name: Build debug APK
        run: |
          start=$(date +%s)
          npx tauri android build --debug --apk --target aarch64 2>&1 | tee logs/android-build.log
          echo "debug_build_seconds=$(( $(date +%s) - start ))" > logs/android-timing.env
      - name: Measure
        if: ${{ !cancelled() }}
        run: |
          mkdir -p apk
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug*.apk' | head -1)
          if [ -z "$apk" ]; then echo "no debug APK was built" | tee logs/android-metrics.md; exit 1; fi
          cp "$apk" apk/AnixOps-SSH-debug-aarch64.apk
          {
            echo "# Android debug APK"
            echo
            echo "- APK: $(basename "$apk"), $(stat -c %s "$apk") bytes"
            echo "- $(tr '_' ' ' < logs/android-timing.env | sed 's/=/: /')"
            echo "- Native library inside:"
            unzip -l "$apk" | grep -E '\.so$' | sed 's/^/    /'
          } | tee logs/android-metrics.md
      # The debug APK carries debug symbols; the release build is what a user
      # would download. Unsigned, informational: it must not fail the job.
      - name: Build release APK (size only)
        if: needs.changes.outputs.installers == 'true'
        continue-on-error: true
        run: |
          start=$(date +%s)
          npx tauri android build --apk --target aarch64 2>&1 | tee logs/android-release-build.log
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          {
            echo
            echo "# Android release APK (unsigned)"
            echo
            echo "- APK: $(basename "$apk"), $(stat -c %s "$apk") bytes"
            echo "- release build seconds: $(( $(date +%s) - start ))"
            unzip -l "$apk" | grep -E '\.so$' | sed 's/^/    /'
          } | tee -a logs/android-metrics.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android
          path: logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: AnixOps-SSH-Android-debug
          path: apk/*.apk
          if-no-files-found: error

  # Publishes logs and screenshots to the `ci-results/<branch>` branch so they
  # can be read with plain git (no API token or log download needed). Pull
  # requests from forks cannot push and are left out.
  report:
    name: Publish results
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: [changes, frontend, rust, e2e, terminal-e2e, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: "{frontend,logs-*}"
      - name: Push to ci-results branch
        env:
          NATIVE: ${{ needs.changes.outputs.native }}
          INSTALLERS: ${{ needs.changes.outputs.installers }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          E2E: ${{ needs.e2e.result }}
          TERMINAL_E2E: ${{ needs.terminal-e2e.result }}
          ANDROID: ${{ needs.android.result }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p results && cd results
          {
            echo "# CI results for ${BRANCH} @ ${SHA::7}"
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Native jobs needed: ${NATIVE}; installers built: ${INSTALLERS}"
            echo "- Frontend and screenshots: ${FRONTEND}"
            echo "- Rust (all platforms; iOS runs in the macOS job): ${RUST}"
            echo "- End-to-end (Linux): ${E2E}"
            echo "- Terminal end-to-end (Linux): ${TERMINAL_E2E}"
            echo "- Android (debug APK): ${ANDROID}"
          } > SUMMARY.md
          git init -q -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "results:refs/heads/ci-results/${BRANCH}"
